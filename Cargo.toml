[package]
name = "be-tree"
description = "Content-addressed copy-on-write Bε-tree: write-optimised, Merkle by construction, MVCC without locks"
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/insanitybit/be-tree"
readme = "README.md"
keywords = ["b-tree", "content-addressed", "copy-on-write", "merkle", "mvcc"]
categories = ["data-structures", "database-implementations"]
publish = false # flip to true when ready to publish to crates.io

[dependencies]
async-trait = "0.1"
blake3 = "1"
bytes = "1"
foldhash = "0.2"
moka = { version = "0.12", features = ["future"] }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints.clippy]
todo = "allow"
